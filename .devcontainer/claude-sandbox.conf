# claude-sandbox.conf — host-global sandbox configuration.
#
# install.sh copies this file to /etc/claude-sandbox.conf, and the agent
# shadow reads it from there at launch — so it applies to `claude` AND
# `codex` in every workspace, with nothing added to individual repos.
# (Codex's own admin policy is separate, at /etc/codex/requirements.toml;
# this file configures the sandbox, that one configures the agent.)
# Edit this file
# (in the sandbox clone) and re-run `./install` (a devcontainer rebuild
# does it for you via postCreate) to apply changes.
#
# Read from /etc, not the workspace: the workspace is bound rw into the
# sandbox, so a per-workspace conf could be rewritten by a compromised
# session to widen the next launch's binds. /etc is not sandbox-writable.
#
# Environment variables take precedence over values set here, so shell or
# CI overrides still work: CLAUDE_SANDBOX_NO_FORGE=1 claude, etc.
#
# ── workspace-root ────────────────────────────────────────────────────
# Override the read-write workspace directory bound into the sandbox.
# Default: /workspaces when $PWD is under /workspaces/, else $PWD.
# Useful when your checkout lives outside /workspaces/ or you want a
# narrower bind than the full /workspaces tree.
#
# workspace-root = /workspaces/myrepo

# ── no-forge ──────────────────────────────────────────────────────────
# Omit gh and glab credential directories from the sandbox so Claude
# cannot authenticate to or push to any remote forge.
# Default: forge credentials are bound (gh/glab can push).
#
# no-forge

# ── allow-write ───────────────────────────────────────────────────────
# Bind an additional path read-write inside the sandbox. May be a
# directory, a file, or a unix socket.
# Repeat for multiple paths. Paths must be absolute; a relative path
# fails launch. Paths that do not exist at launch time are
# silently skipped.
# Default: only the workspace root is writable.
#
# allow-write = /workspaces/peer-project
#
# An allow-write bind is applied after the sandbox's own /run/{user,
# secrets} tmpfs masks, so it re-exposes a single path *through* a mask
# without lifting it. That is how you reach a rootless podman/docker
# socket under $XDG_RUNTIME_DIR (= /run/user/<uid>), which the /run/user
# mask would otherwise hide along with the host's ssh-agent, gpg-agent
# and keyring sockets:
#
# allow-write = /run/user/1000/podman/podman.sock
#
# Name the socket, not the directory above it: `allow-write = /run/user/
# 1000` also works, but unmasks those agent sockets to the session.
#
# Never re-expose the session bus (/run/user/<uid>/bus) or an X11 socket
# (/tmp/.X11-unix/X0): either one lets the session run programs on your
# desktop, outside every other defence here. To give an agent VS Code, run it
# inside the sandbox instead (skill: vscode-headless).
allow-write = /cache

# ── egress-jail ───────────────────────────────────────────────────────
# Network egress jail (ADR 0015): run only Claude in its own network
# namespace, bridged to the internet by pasta, with a routing allowlist
# that blackholes RFC1918 (internal LANs / link-local) so a compromised
# session cannot pivot to internal hosts or lab devices. Normal
# (non-Claude) shells keep host networking untouched.
# Requires: pasta (passt) installed and --device=/dev/net/tun on the
# container. Fail-closed — if those are missing `claude` will NOT launch.
# Default: ON.

# ── local-model-port / local-port ─────────────────────────────────────
# Relay chosen TCP ports from the container's 127.0.0.1 into the agent's
# private loopback, for every agent (ADR 0020). local-model-port is the
# port Pi discovers a model on (default 1920, matching lllm2's model API;
# 0 drops it and Pi's discovery). local-port adds further ports; repeat
# it once per port. Services can stay bound to host loopback when using
# --network=host; a bridge container's loopback refers to that container,
# not the host. No LAN route or broad host-loopback mapping is added;
# every other localhost port stays unreachable. Each relayed service is
# exposed in full, so list only what you would hand the agent outright.
# Restart the agent after changing this root-owned config, or set
# CLAUDE_SANDBOX_LOCAL_PORTS (space/comma separated) in the environment
# to add ports for one session, e.g. 8082 for the lllm2 panel.
local-model-port = 1920
#
# local-port = 8082    # lllm2 panel and its experiments API

# ── callback-port ─────────────────────────────────────────────────────
# The reverse relay (ADR 0021): a TCP port the agent listens on inside its
# private loopback becomes reachable at the same port on the container's
# 127.0.0.1, so a browser on the host can complete an OAuth login whose
# redirect goes to http://localhost:<port>/... Only fixed ports can be
# listed; a login that picks a random port still needs its paste-the-URL
# fallback. Repeat for multiple ports, or set CLAUDE_SANDBOX_CALLBACK_PORTS
# (space/comma separated) in the environment for one session. A port may
# not also appear as local-port or local-model-port. If the port is already
# taken on the host (a second session, an unwrapped agent) the session
# still starts, with a warning, and that browser login falls back to
# pasting the redirect URL. The relay serves every agent; a port nothing
# inside listens on is refused, not held open.

# NOTE: these only work for one sandbox at a time as they bind to host ports
# callback-port = 53692    # Pi: Claude Pro/Max login (no alternative flow)
#
# callback-port = 1455   # Codex CLI and Pi's Codex login (or use device auth)
# callback-port = 1456   # Pi's Radius login

# ── allow-ip ──────────────────────────────────────────────────────────
# Keep these device IPs reachable past the RFC1918 blackhole (e.g. EPICS
# IOCs, PMACs addressed by bare IP). Repeat for multiple devices.
# Default: no RFC1918 destination is reachable, except the example below.
#
# Example / default: Diamond's internal GitLab. With the jail on, this keeps
# `git push` to the forge working — the hostname resolves via the pasta DNS
# forwarder, then routes out via this /32 instead of hitting the blackhole.
# Replace or extend with your own site's forge / device IPs.
allow-ip = 172.23.142.119
# allow-ip = 172.23.1.3
# ── pass-env ──────────────────────────────────────────────────────────
# Forward named environment variables into the sandbox. The sandbox
# scrubs the environment (--clearenv) and re-exports only what Claude
# itself needs, so a variable your *project* depends on — DOCKER_HOST for
# a container-based test suite, a path a fixture reads — does not survive
# into the session unless named here.
#
# Names, not assignments: the value is read from the environment `claude`
# is launched with, so this forwards what your shell already has and
# cannot invent a value. A named variable that is unset at launch is
# skipped.
#
# Comma- or space-separate names, and/or repeat the key.
# Default: nothing beyond the sandbox's own list (TERM, LANG, VIRTUAL_ENV,
# the UV_* vars, …).
#
# pass-env = DOCKER_HOST
# pass-env = MY_SERVICES_PATH, MY_TEST_FIXTURE_DIR
#
# Variables the sandbox sets itself (PATH, HOME, USER, IS_SANDBOX,
# GIT_CONFIG_GLOBAL, GIT_CONFIG_SYSTEM) and the loader/shell hooks
# (LD_*, BASH_ENV, ENV, SHELLOPTS, BASHOPTS, IFS) are ignored here — the
# sandbox's own value always wins.
