# Build and publish the claude-sandbox container image (the
# `claude-sandbox` stage of the root Dockerfile) to GHCR — sandboxed
# Claude Code for hosts without a devcontainer workflow. Mirrors the
# DiamondLightSource/ubuntu-devcontainer approach: per-arch native builds
# pushed by digest, merged into one multi-arch manifest.
#
# The in-image auto-updater is disabled by design (managed updater settings), so
# the baked Claude version is frozen at build time — the weekly cron
# rebuild is what picks up new Claude releases.
name: Container

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      # The launcher version baked into the image as a label, so the
      # launcher can warn when the user's copy is out of date. On a release
      # tag it is the tag (the wheel built from the same tag reports the
      # same, ADR 23); otherwise the script's own VERSION line.
      - name: Extract launcher version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            v="${{ github.ref_name }}"
          else
            v="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' container/claude-container)"
          fi
          test -n "$v"
          echo "LAUNCHER_VERSION=$v" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: claude-sandbox
          load: true
          tags: claude-sandbox:test
          build-args: |
            LAUNCHER_VERSION=${{ env.LAUNCHER_VERSION }}
            CLAUDE_SANDBOX_VERSION=${{ github.ref_name }}

      - name: "Test: baked install is complete"
        run: |
          docker run --rm --entrypoint bash claude-sandbox:test -c '
            set -euxo pipefail
            test -x /usr/local/bin/claude
            test -x /usr/libexec/claude-sandbox/claude
            test -x /usr/local/bin/pi
            test -x /usr/libexec/claude-sandbox/pi-run
            test -x /usr/libexec/claude-sandbox/pi-dist/pi
            test -x /usr/libexec/claude-sandbox/verify-sandbox-battery.sh
            test -f /etc/claude-sandbox.conf
            jq -e ".autoUpdates == false
                   and .env.DISABLE_AUTOUPDATER == \"1\"" \
              /etc/claude-code/managed-settings.json
            /usr/libexec/claude-sandbox/claude --version
            /usr/libexec/claude-sandbox/pi-dist/pi --version
            # Image-only Python: baked interpreter, venv under /cache reached
            # through the container-local /opt/venv symlink on PATH (the
            # entrypoint repoints it at the per-project venv)
            test -x /cache/venv/bin/python
            test "$(readlink -f /opt/venv)" = /cache/venv
            python -c "import os, sys; assert os.path.realpath(sys.prefix) == \"/cache/venv\", sys.prefix"
            # (uv python find would answer with the active venv itself)
            grep -q "^home = /opt/uv/python/" /cache/venv/pyvenv.cfg
            # Image-only Node LTS: node/npm/npx from the official image
            case "$(node --version)" in v22.*) ;; *) echo "node is not v22: $(node --version)"; exit 1 ;; esac
            npm --version >/dev/null
            npx --version >/dev/null
            test "$(npm config get ignore-scripts)" = true
          '

      - name: "Test: launcher-version label is what CI extracted"
        run: |
          label="$(docker image inspect \
            -f '{{index .Config.Labels "io.diamondlightsource.claude-sandbox.launcher-version"}}' \
            claude-sandbox:test)"
          echo "label=$label expected=$LAUNCHER_VERSION"
          test -n "$label"
          test "$label" = "$LAUNCHER_VERSION"

      # In-container bwrap needs unprivileged userns: ubuntu-24.04
      # runners restrict it (same workaround as ci.yml), and docker's
      # default seccomp/apparmor confinement must be lifted for the
      # nested sandbox in the e2e test below.
      - name: Allow unprivileged userns on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: "Test: end-to-end sandboxed launch (entrypoint -> shadow -> jail -> bwrap)"
        run: |
          # Rootless podman is the sandbox's supported runtime, and the one
          # the egress jail's pasta-attach is validated on. Rootful docker
          # denies pasta the /proc/<holder>/ns/user open (differing ns/
          # ptrace semantics), so the e2e runs under the runner's rootless
          # podman: move the built image across, then launch for real.
          command -v podman >/dev/null || sudo apt-get install -y -qq podman
          docker save claude-sandbox:test | podman load
          mkdir -p "$RUNNER_TEMP/terminal-config" "$RUNNER_TEMP/project"
          podman run --rm -t \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt label=disable \
            --device /dev/net/tun \
            -v "$RUNNER_TEMP/terminal-config:/user-terminal-config" \
            -v "$RUNNER_TEMP/project:/work" -w /work \
            claude-sandbox:test bash -c '
              git config --global user.name "Sandbox integration test" || exit "$?"
              git config --global user.email "sandbox-test@example.invalid" || exit "$?"
              claude --version || {
                rc=$?
                echo "=== jail diagnostics (launch failed, rc=$rc) ==="
                echo "--- /tmp/claude-pasta.log ---"; cat /tmp/claude-pasta.log 2>/dev/null || true
                echo "--- pasta version ---"; pasta --version 2>&1 | head -2 || true
                echo "--- /etc/resolv.conf ---"; cat /etc/resolv.conf || true
                echo "--- ip addr / route ---"; ip -o addr; ip route || true
                exit "$rc"
              }
              for agent in claude codex pi; do
                claude-sandbox verify --agent "$agent" || exit "$?"
              done'

      - name: "Test: Pi streams a local tool call through the sandbox"
        run: |
          podman run --rm -t \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt label=disable \
            --device /dev/net/tun \
            -v "$RUNNER_TEMP/terminal-config:/user-terminal-config" \
            claude-sandbox:test bash /opt/claude-sandbox/tests/pi_e2e.sh

      # The opt-in Python shadow (issue #72 phase 2), installed over the
      # baked bash one, with the egress jail on (the default): the same
      # launches as the bash step above, the entry-point guard end to end
      # (tests/entry_guard.sh), then the Python jail's own tests in real
      # namespaces (tests/jail_python.sh, which fetches pytest).
      # Runs after the bash steps above and changes nothing they use.
      - name: "Test: opt-in Python shadow (egress jail on)"
        run: |
          podman run --rm -t \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt label=disable \
            --device /dev/net/tun \
            -v "$RUNNER_TEMP/terminal-config:/user-terminal-config" \
            -v "$RUNNER_TEMP/project:/work" -w /work \
            claude-sandbox:test bash -c '
              git config --global user.name "Sandbox integration test" || exit "$?"
              git config --global user.email "sandbox-test@example.invalid" || exit "$?"
              before="$(ls -A "$HOME/.local/bin" 2>/dev/null)"
              CLAUDE_SANDBOX_IMPL=python \
                bash /opt/claude-sandbox/.devcontainer/claude-sandbox/install.sh --image-build \
                || exit "$?"
              # The opt-in writes only under /usr/libexec/claude-sandbox.
              [ "$(ls -A "$HOME/.local/bin" 2>/dev/null)" = "$before" ] || {
                echo "the Python shadow install changed ~/.local/bin"; exit 1; }
              grep -q " -I -m claude_sandbox _shadow " /usr/local/bin/claude || exit 1
              claude --version || {
                rc=$?
                echo "--- /tmp/claude-pasta.log ---"
                cat /tmp/claude-pasta.log 2>/dev/null || true
                exit "$rc"
              }
              for agent in claude codex pi; do
                claude-sandbox verify --agent "$agent" || exit "$?"
              done
              bash /opt/claude-sandbox/tests/entry_guard.sh || exit "$?"
              bash /opt/claude-sandbox/tests/jail_python.sh'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: claude-sandbox
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LAUNCHER_VERSION=${{ env.LAUNCHER_VERSION }}
            CLAUDE_SANDBOX_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect manifest
        run: |
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag"
