# Copied from the DLS python-copier template (as in podbench).
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
      - name: Build the wheel (wheel-only, the tree is force-included from the repo root)
        run: >
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) &&
          uvx --from build pyproject-build --wheel --outdir dist
      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
      - name: Check for packaging errors
        run: uvx twine check --strict dist/*
      - name: Install produced wheel
        run: python -m pip install dist/*.whl
      - name: Test --version works using the installed wheel
        run: claude-sandbox --version
