name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bubblewrap jq

      # Ubuntu 24.04 runners ship with
      # kernel.apparmor_restrict_unprivileged_userns=1, so plain bwrap
      # fails with "setting up uid map: Permission denied". Relax the
      # sysctl and install an unconfined AppArmor profile for bwrap so
      # downstream checks can spawn the sandbox.
      - name: Allow unprivileged userns on Ubuntu 24.04
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          PROFILE
          sudo systemctl reload apparmor || sudo apparmor_parser -r /etc/apparmor.d/bwrap || true
          bwrap --ro-bind / / --unshare-user --unshare-pid -- /usr/bin/true

      - name: Pre-create /run/secrets so bwrap can mount its tmpfs there
        run: sudo mkdir -p /run/secrets

      # ubuntu-latest runners have $GITHUB_WORKSPACE living under
      # $HOME=/home/runner. Anything that path-checks $HOME contains-X
      # gets tripped by the workspace bind — re-home to a clean dir
      # before invoking bwrap.
      - name: Run bwrap_argv unit tests
        run: |
          export HOME=/tmp/sandbox-home
          mkdir -p "$HOME/.claude" "$HOME/.cache"
          CLAUDE_SANDBOX_SMOKE=1 bash tests/bwrap_argv.sh

      - name: Run Codex launcher lifecycle tests
        run: bash tests/codex_launch.sh

      - name: Run shadow terminal wrapper tests
        run: bash tests/shadow_launch.sh

      - name: Run direct sandbox verification tests
        run: bash tests/verify.sh

      # Which git ref `install` selects, and when it refuses to select one.
      # Hermetic — builds its own throwaway origin+clone with synthetic tags,
      # so it never touches this checkout. `sudo` only to clear the shim's own
      # `id -u` gate (the runner is not root; a devcontainer is): the stub
      # installer it execs does nothing. NOT CLAUDE_SANDBOX_SMOKE=1, which
      # would clear that gate but also force --here, defeating the test.
      - name: Run install revision-selection tests
        run: sudo -E bash tests/install_ref.sh

      - name: Run install smoke test
        run: |
          export HOME=/tmp/sandbox-home
          mkdir -p "$HOME/.claude" "$HOME/.cache"
          CLAUDE_SANDBOX_SMOKE=1 sudo -E bash tests/smoke.sh

      # The same suite against the opt-in Python installer (issue #72 phase
      # 4). A smoke run starts it from the tree with the runner's python3.
      - name: Run install smoke test (Python installer)
        run: |
          export HOME=/tmp/sandbox-home
          mkdir -p "$HOME/.claude" "$HOME/.cache"
          CLAUDE_SANDBOX_IMPL=python CLAUDE_SANDBOX_SMOKE=1 \
            CLAUDE_SANDBOX_SMOKE_PYTHON="$(command -v python3)" sudo -E bash tests/smoke.sh

      - name: Run Pi profile and configuration tests
        run: bash tests/pi.sh

      - name: Compare container and image installation modes
        run: |
          bash tests/install_modes.sh
          CLAUDE_SANDBOX_IMPL=python bash tests/install_modes.sh

      # Launcher verbs and host-network default against a fake engine.
      - name: Run container launcher tests
        run: bash tests/launcher.sh

      - name: Run user NVIDIA CDI setup tests
        run: bash tests/nvidia_cdi.sh

      - name: Run doctor tests
        run: bash tests/doctor.sh

      - name: Run container Git configuration tests
        run: bash tests/container_git.sh

      - name: Run shadow Git configuration tests
        run: bash tests/shadow_git.sh

  python:
    # The Python package (ADR 26): lint, type-check and test against the
    # committed dev lockfile. pytest collects tests/python only; the bash
    # suites above stay as they are. Run on the requires-python floor and on
    # 3.13, the interpreter the sandbox will install: os.path.realpath and
    # friends differ between the two, and the argv must not.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs: version from git tags
      - uses: astral-sh/setup-uv@v6

      - name: Install the dev environment from uv.lock
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: pyright
        run: uv run pyright

      # Coverage settings, including fail_under = 95, live in pyproject.toml.
      # The bash-vs-Python argv comparison (tests/python/test_parity.py)
      # also runs here; it needs bash, coreutils and git, which the runner has.
      - name: pytest with coverage
        run: uv run pytest --cov

  wheel:
    # The PyPI front door (ADR 23): build the wheel from the root
    # pyproject.toml, prove the entry point execs the bundled bash, and prove
    # `install` refuses on a host (the runner is a VM, not a container).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs: version from git tags
      - uses: astral-sh/setup-uv@v6

      - name: Build the wheel
        run: uv build --wheel -o dist

      - name: "Test: the entry point runs the bundled launcher at the wheel version"
        run: |
          v="$(uvx --from dist/*.whl claude-sandbox --version)"
          echo "$v"
          case "$v" in "claude-sandbox "[0-9]*) ;; *) exit 1 ;; esac
          # On a release tag the wheel reports the tag itself (hatch-vcs)
          if [ "${{ github.ref_type }}" = tag ]; then
            test "$v" = "claude-sandbox ${{ github.ref_name }}"
          fi
          uvx --from dist/*.whl claude-sandbox --help | grep -q "^Usage: claude-container"

      - name: "Test: install refuses outside a container"
        run: |
          if uvx --from dist/*.whl claude-sandbox install 2>err; then
            echo "install ran on the host"; exit 1
          fi
          grep -q "refusing to install outside a container" err

      - name: "Test: the bundled tree is the checkout's"
        run: |
          mkdir -p x && (cd x && unzip -q ../dist/*.whl)
          diff -r x/claude_sandbox/tree/.devcontainer/claude-sandbox .devcontainer/claude-sandbox
          cmp x/claude_sandbox/tree/install install
          cmp x/claude_sandbox/tree/container/claude-container container/claude-container
          cmp x/claude_sandbox/tree/.devcontainer/claude-sandbox.conf .devcontainer/claude-sandbox.conf
          cmp x/claude_sandbox/tree/.claude/statusline-command.sh .claude/statusline-command.sh
          diff -r x/claude_sandbox/tree/skills skills

  egress-jail:
    # Exercises the egress-jail netns routing enforcement (ADR 0015 / issue #56),
    # which the rest of CI never touches: smoke.sh stays outside the netns and
    # verify-sandbox's jail checks need a live jailed `claude` (manual). The test
    # drives the REAL netns_holder in a throwaway netns and asserts the blackhole
    # allowlist + fail-closed behaviour. The test is CAPABILITY-GATED and skips
    # cleanly where the caps are absent (a dev box, or an in-jail session where
    # namespaces cannot nest) — but this job runs it with EGRESS_JAIL_REQUIRE=1,
    # which turns any skip into a FAILURE. A green check here therefore means the
    # assertions ran, not merely that nothing exploded. Kept a separate job (not
    # folded into `test`) so the jail's enforcement coverage is legible on its own
    # in the CI matrix.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install netns deps (passt + iproute2)
        run: |
          sudo apt-get update -qq
          # passt provides `pasta` (the live leg); iproute2 (`ip`) and
          # util-linux (`unshare`) are normally preinstalled — install to be safe.
          sudo apt-get install -y -qq --no-install-recommends \
            passt iproute2 util-linux socat curl

      # Ubuntu 24.04 runners ship kernel.apparmor_restrict_unprivileged_userns=1,
      # which blocks the `unshare -rn` the holder needs. Relax it (mirrors the
      # `test` job's bwrap workaround). `|| true` keeps a runner whose sysctl name
      # has changed from failing HERE — the next step is where it must surface,
      # and under EGRESS_JAIL_REQUIRE=1 it will: no caps means a failed job, not
      # a silent skip. That is deliberate. If this starts failing because GitHub
      # changed the runner image, fix the workaround — do not relax the require.
      - name: Allow unprivileged userns on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run egress-jail netns enforcement test
        env:
          # A skip must FAIL here. The test self-gates on netns/CAP_NET_ADMIN
          # (and pasta/tun for the live leg), which is right on a dev box or in
          # an in-jail session where namespaces cannot nest — but in CI a skip
          # is invisible: the check goes green either way and the only evidence
          # is a log line nobody reads on a passing run. Since this file is the
          # jail enforcement's ONLY automated coverage, a runner that quietly
          # stopped granting the caps would retire every blackhole and
          # fail-closed assertion with CI still green. EGRESS_JAIL_REQUIRE=1
          # makes green mean "the assertions actually ran".
          EGRESS_JAIL_REQUIRE: 1
        run: bash tests/egress_jail.sh

      - name: Run localhost model relay tests
        env:
          EGRESS_JAIL_REQUIRE: 1
        run: bash tests/local_model.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck

      - name: shellcheck
        run: |
          # Every tracked bash script (by .sh/.bash suffix or shebang), minus
          # the docs/ Python toolchain and build artefacts.
          mapfile -t files < <(
            git ls-files ':!:docs/**' ':!:build/**' | while read -r f; do
              case "$f" in
                *.sh|*.bash) printf '%s\n' "$f" ;;
                *) [ -f "$f" ] && head -1 "$f" | grep -qE '^#!.*\b(ba)?sh\b' \
                     && printf '%s\n' "$f" ;;
              esac
            done
          )
          printf 'Linting %d scripts:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          # Blocking gate: error severity only — real bugs (parse errors, etc.).
          # The scripts pass `bash -n`, so this is expected to stay green.
          shellcheck --severity=error "${files[@]}"
          # Advisory: surface warning/info findings without gating, so severity
          # can be ratcheted up over time. (shfmt is a deferred follow-up.)
          shellcheck "${files[@]}" \
            || echo "::warning::shellcheck reported advisory (warning/info) findings"

  # Release plumbing copied from the DLS python-copier template (see podbench):
  # a tag push builds the wheel, publishes it to PyPI by trusted publishing and
  # attaches it to a GitHub release.
  dist:
    uses: ./.github/workflows/_dist.yml

  pypi:
    needs: [dist, test, python, wheel, egress-jail, lint]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/_pypi.yml
    permissions:
      id-token: write

  release:
    needs: [dist, test, python, wheel, egress-jail, lint]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write
